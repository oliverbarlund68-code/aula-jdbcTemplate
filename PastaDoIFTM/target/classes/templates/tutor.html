<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Dados do Tutor</title>
</head>
<body>
    <h1>Dados do Tutor</h1>
    <p><strong>Nome:</strong> <span th:text="${tutor.nome}"></span></p>
    <p><strong>Telefone:</strong> <span th:text="${tutor.telefone}"></span></p>
    <p><strong>Total de animais cadastrados:</strong> <span th:text="${totalAnimais}"></span></p>
</body>
</html>
